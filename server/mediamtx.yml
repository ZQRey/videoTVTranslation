# Конфигурация потокового сервера MediaMTX (RTSP / HLS)

# Протоколы и сетевые порты
protocols: [tcp, udp]
rtspAddress: :8554
hlsAddress: :8888

# Настройки путей потоков
paths:
  # Путь вещания по умолчанию для нашего сервера и клиентов
  live:
    source: publisher

  # Разрешать публикацию в любые произвольные пути
  all_others:
