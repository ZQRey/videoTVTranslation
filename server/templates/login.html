<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему — StreamServer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#10b981',
                            600: '#059669',
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'Fira Code', 'Courier New', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }
        .radial-glow {
            background: radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.12) 0%, rgba(11, 15, 25, 0) 70%);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen font-sans flex items-center justify-center p-4 antialiased selection:bg-emerald-500 selection:text-black radial-glow">

    <div class="w-full max-w-md my-8" x-data="loginApp()" x-cloak>
        <!-- Карточка авторизации -->
        <div class="glass-panel rounded-2xl p-8 shadow-2xl space-y-6 relative overflow-hidden">
            <!-- Верхняя подсветка -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-500/20 via-emerald-500 to-emerald-500/20"></div>

            <!-- Логотип и заголовок -->
            <div class="text-center space-y-2">
                <div class="inline-flex w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/30 items-center justify-center text-emerald-400 mb-1 shadow-inner">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                    StreamServer
                    <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-slate-800 text-emerald-400 border border-slate-700">Security</span>
                </h1>
                <p class="text-xs text-slate-400">Авторизация в панели управления вещанием</p>
            </div>

            <!-- Переключатель режима входа -->
            <div class="grid grid-cols-2 p-1 bg-slate-900/90 rounded-xl border border-slate-800 text-xs font-medium">
                <button type="button" @click="setAuthType('local')" 
                        :class="authType === 'local' ? 'bg-slate-800 text-emerald-400 shadow-sm' : 'text-slate-400 hover:text-slate-200'"
                        class="py-2 px-3 rounded-lg transition-all flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <span>Локальный вход</span>
                </button>
                <button type="button" @click="setAuthType('domain')" 
                        :class="authType === 'domain' ? 'bg-slate-800 text-emerald-400 shadow-sm' : 'text-slate-400 hover:text-slate-200'"
                        class="py-2 px-3 rounded-lg transition-all flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                    <span>Active Directory</span>
                </button>
            </div>

            <!-- Сообщение об ошибке -->
            <div x-show="errorMessage" class="p-3.5 rounded-xl bg-rose-950/50 border border-rose-500/50 text-rose-300 text-xs flex items-start gap-2.5 shadow-sm">
                <svg class="w-4 h-4 text-rose-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <div class="flex-1 font-medium leading-relaxed" x-text="errorMessage"></div>
            </div>

            <!-- Информационный баннер для Active Directory -->
            <div x-show="authType === 'domain'" class="p-3 rounded-xl bg-slate-900/80 border border-slate-800 text-[11px] text-slate-400 space-y-1">
                <div class="flex items-center gap-1.5 text-amber-400 font-semibold">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    <span>Только для Администраторов домена</span>
                </div>
                <p>Аутентификация через контроллер <span class="text-slate-300 font-mono">dc01.gp1.loc</span>. Пользователь должен входить в группу <span class="text-emerald-400 font-mono">Администраторы домена</span>.</p>
            </div>

            <!-- Форма авторизации -->
            <form @submit.prevent="submitLogin" class="space-y-4">
                <!-- Поле логина -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">
                        <span x-text="authType === 'local' ? 'Имя пользователя:' : 'Доменный логин (sAMAccountName):'"></span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </span>
                        <input type="text" x-model="username" required autofocus
                               :placeholder="authType === 'local' ? 'admin' : 'ivanov или ivanov@gp1.loc'"
                               class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-slate-200 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition font-mono">
                    </div>
                </div>

                <!-- Поле пароля -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-xs font-semibold text-slate-300">
                            <span x-text="authType === 'local' ? 'Пароль:' : 'Пароль учетной записи домена:'"></span>
                        </label>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                        <input :type="showPassword ? 'text' : 'password'" x-model="password" required
                               placeholder="••••••••••••"
                               class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-10 py-2.5 text-xs text-slate-200 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition font-mono">
                        <button type="button" @click="showPassword = !showPassword" 
                                class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-300 transition">
                            <svg x-show="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg x-show="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Кнопка отправки -->
                <button type="submit" :disabled="loading"
                        class="w-full mt-2 py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white rounded-xl text-xs font-semibold shadow-lg shadow-emerald-950/50 transition flex items-center justify-center gap-2">
                    <svg x-show="loading" class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span x-text="loading ? 'Выполняется проверка...' : (authType === 'local' ? 'Войти в систему' : 'Войти через Active Directory')"></span>
                </button>
            </form>

            <div class="pt-2 text-center text-[10px] text-slate-600 font-mono">
                Continuous Broadcast RTSP / HLS Server
            </div>
        </div>
    </div>

    <script>
        function loginApp() {
            return {
                authType: 'local', // 'local' | 'domain'
                username: 'admin',
                password: '',
                showPassword: false,
                loading: false,
                errorMessage: '',

                setAuthType(type) {
                    this.authType = type;
                    this.errorMessage = '';
                    if (type === 'local') {
                        this.username = 'admin';
                    } else {
                        this.username = '';
                    }
                    this.password = '';
                },

                async submitLogin() {
                    this.loading = true;
                    this.errorMessage = '';

                    try {
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                username: this.username,
                                password: this.password,
                                auth_type: this.authType
                            })
                        });

                        const data = await response.json();

                        if (response.ok && data.success) {
                            // Перенаправляем на главную страницу панели
                            window.location.href = '/';
                        } else {
                            this.errorMessage = data.detail || data.message || 'Ошибка авторизации. Проверьте введенные данные.';
                        }
                    } catch (err) {
                        this.errorMessage = 'Ошибка соединения с сервером при попытке входа.';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
